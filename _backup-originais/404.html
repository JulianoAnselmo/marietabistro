<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada — Marieta Bistrô</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://marietabistro.com.br">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    :root {
      --wine:  #7B2D3E;
      --gold:  #D4AF37;
      --dark:  #1A0F0A;
      --cream: #F6F1DF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--dark);
      color: var(--cream);
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      opacity: 0.9;
    }
    .logo img { width: 100%; height: 100%; object-fit: contain; }
    .code {
      font-size: 5rem;
      font-weight: 700;
      color: var(--wine);
      line-height: 1;
      letter-spacing: -2px;
      margin-bottom: 12px;
      font-family: 'Georgia', serif;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: var(--gold);
      margin: 20px auto;
      opacity: 0.6;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--cream);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    p {
      font-size: 0.95rem;
      color: rgba(246,241,223,0.5);
      line-height: 1.7;
      max-width: 360px;
      margin: 0 auto 36px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    a {
      display: inline-block;
      padding: 12px 32px;
      background: var(--wine);
      color: var(--cream);
      text-decoration: none;
      border-radius: 50px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.2s;
    }
    a:hover { background: #9a3a50; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/imagens/logo-marieta.png" alt="Marieta Bistrô" onerror="this.style.display='none'">
  </div>
  <div class="code">404</div>
  <div class="divider"></div>
  <h1>Página não encontrada</h1>
  <p>A página que você procura não existe ou foi movida. Volte para o início e explore o cardápio.</p>
  <a href="/">Voltar ao início</a>
</body>
</html>
